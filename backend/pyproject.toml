[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aya-backend"
version = "0.1.0"
description = "Lukas presentation API and worker"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic-settings>=2.4,<3",
  "python-dotenv>=1,<2",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "psycopg[binary]>=3.2,<4",
  "redis>=5,<7",
  "rq>=1.16,<3",
  "python-multipart>=0.0.9,<1",
  "python-pptx>=1.0,<2",
  "pypdf>=5,<7",
  "pdfplumber>=0.11,<1",
  "pypdfium2>=5.9,<6",
  "python-docx>=1.1,<2",
  "Pillow>=10,<13",
]
[project.optional-dependencies]
test = ["pytest>=8,<9", "httpx>=0.27,<1"]
[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "engine*"]
[tool.pytest.ini_options]
testpaths = ["tests", "engine/tests"]




[tool.setuptools.package-data]
engine = ["prompts/*.txt"]
